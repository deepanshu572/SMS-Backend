<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timetable · EduNexa</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/timetable.css">
</head>
<body data-page="timetable">
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="top" id="top"></div>
    <div class="head"><div><h1>Weekly Timetable</h1><p>View and manage class schedules</p></div><div class="btns"><select id="tc" aria-label="Class"><option value='9-A'>Class 9-A</option><option value='9-B'>Class 9-B</option><option value='10-A'>Class 10-A</option><option value='10-B'>Class 10-B</option></select><button class="btn" id="mp"><svg viewBox="0 0 24 24" width="16" height="16" style="vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg> Manage Periods</button></div></div>
    <div class="lgd" id="leg"></div>
    <div class="card tbl"><div class="tw"><table id="tt"></table></div></div>
    <div class="modal" id="tm"><form class="mbox" id="tmf"><h3 id="tmh">Edit period</h3><label>Subject<select id="tsub"></select></label><label>Teacher<select id="ttch"></select></label><div class="btns"><button type="button" class="btn" id="tmx">Cancel</button><button class="btn fill">Save</button></div></form></div>
    <div class="modal" id="pm"><form class="mbox wd" id="pf"><h3>Manage Periods</h3><div id="pl"></div><button type="button" class="btn" id="pa">+ Add period</button><div class="btns"><button type="button" class="btn" id="px">Cancel</button><button class="btn fill">Save periods</button></div></form></div>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
