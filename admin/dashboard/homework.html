<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homework · EduNexa</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/homework.css">
</head>
<body data-page="homework">
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="top" id="top"></div>
    <div class="head"><div><h1>Homework</h1><p>Assign work and track what is done.</p></div></div><div class="card"><form class="hf" id="hf"><input class="inp" id="ht" placeholder="Homework title" required><select id="hs"><option>Maths</option><option>Science</option><option>English</option><option>Hindi</option><option>SST</option><option>Computer</option></select><select id="hc"><option>9-A</option><option>9-B</option><option>10-A</option><option>10-B</option></select><input class="inp" type="date" id="hd" required><button class="btn fill">Assign</button></form></div><br><div class="card"><div class="tabs" id="hb"><button class="on" data-f="all">All</button><button data-f="p">Pending</button><button data-f="d">Done</button></div><div id="hl"></div></div>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
