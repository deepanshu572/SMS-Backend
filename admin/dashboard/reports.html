<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reports · EduNexa</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/reports.css">
</head>
<body data-page="reports">
<div class="app">
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="top" id="top"></div>
    <div class="head"><div><h1>Reports</h1><p>Live numbers from your student records.</p></div></div><div class="kpis"><div class="card kpi"><span>Average attendance</span><b id="r1" data-n="0" data-s="%"></b></div><div class="card kpi"><span>Fees collected</span><b id="r2" data-n="0" data-s="%"></b></div><div class="card kpi"><span>Students on record</span><b id="r3" data-n="0"></b></div></div><div class="two"><div class="card"><h3>Average attendance by class (%)</h3><div id="rc"></div></div><div class="card"><h3>Download reports</h3><div id="rl"><div class="row"><div><b>Student list</b><small>Name, class, roll and attendance</small></div><button class="tag" data-dl="students">Download CSV</button></div><div class="row"><div><b>Fee status</b><small>Who has paid and who is due</small></div><button class="tag" data-dl="fees">Download CSV</button></div><div class="row"><div><b>Today's attendance</b><small>Present and absent list</small></div><button class="tag" data-dl="attendance">Download CSV</button></div></div></div></div>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
